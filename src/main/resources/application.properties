spring.config.import=optional:file:.env[.properties]
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://local:local@localhost:27017/local?authSource=admin}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:local}
discord.token=${DISCORD_TOKEN:}
discord.commandPrefix=${DISCORD_COMMAND_PREFIX:>}
discord.voiceCommandPrefix=${DISCORD_VOICE_COMMAND_PREFIX:<}
discord.privilegedCommandPrefix=${DISCORD_PRIVILEGED_COMMAND_PREFIX:$}
discord.primaryPrivilegedUserId=${DISCORD_PRIMARY_PRIVILEGED_USER_ID:}
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost}
features.meme-repost=${FEATURES_MEME_REPOST:false}